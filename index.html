<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentBoard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f9fb;
      --bg-tertiary: #f1f3f5;
      --border: #e2e5e9;
      --border-light: #eef0f2;
      --text: #1a1d21;
      --text-secondary: #5f6b7a;
      --text-tertiary: #8b95a5;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff4ff;
      --green: #10b981;
      --green-bg: #ecfdf5;
      --green-border: #a7f3d0;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --purple: #7c3aed;
      --purple-light: #f5f3ff;
      --purple-border: #ddd6fe;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: var(--bg-secondary);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-left h1 {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.3px;
    }

    .tagline {
      font-size: 13px;
      color: var(--text-tertiary);
      font-weight: 450;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .api-key-input {
      width: 220px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .api-key-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .api-key-saved {
      font-size: 11.5px;
      color: #047857;
      font-weight: 500;
      padding: 4px 10px;
      background: var(--green-bg);
      border-radius: 999px;
      display: none;
    }

    /* Layout */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 28px;
      align-items: start;
    }

    /* Panel */
    .panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    .panel-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.1px;
    }

    .panel-body {
      padding: 22px;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-of-type {
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 550;
      color: var(--text-secondary);
      margin-bottom: 5px;
      letter-spacing: 0.1px;
    }

    input, textarea {
      width: 100%;
      padding: 8px 11px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-tertiary);
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea { resize: vertical; min-height: 60px; }

    .btn {
      width: 100%;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 550;
      font-family: inherit;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-sm {
      width: auto;
      padding: 6px 14px;
      font-size: 12.5px;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--bg-secondary); }

    .btn-purple {
      background: var(--purple);
    }

    .btn-purple:hover { background: #6d28d9; }

    /* Toast */
    .toast {
      margin-top: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      display: none;
    }

    .toast.success {
      display: block;
      background: var(--green-bg);
      color: #065f46;
      border: 1px solid var(--green-border);
    }

    .toast.error {
      display: block;
      background: var(--red-bg);
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* Search */
    .search-section { margin-bottom: 22px; }

    .search-bar {
      display: flex;
      gap: 8px;
    }

    .search-bar input {
      flex: 1;
    }

    .search-bar button {
      width: auto;
      flex-shrink: 0;
      padding: 8px 18px;
    }

    .search-hint {
      font-size: 11.5px;
      color: var(--text-tertiary);
      margin-top: 6px;
    }

    .search-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    .search-label {
      font-size: 12.5px;
      font-weight: 550;
      color: var(--purple);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .search-label svg {
      width: 14px;
      height: 14px;
      stroke: var(--purple);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .clear-search {
      font-size: 12px;
      color: var(--text-tertiary);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 6px;
      border-radius: 4px;
      width: auto;
    }

    .clear-search:hover { color: var(--text-secondary); background: var(--bg-tertiary); }

    /* Agent list */
    .agent-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agent-card {
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .agent-card:hover {
      border-color: #d0d5db;
      box-shadow: var(--shadow-md);
    }

    .agent-card.matched {
      border-color: var(--purple-border);
      background: var(--purple-light);
    }

    .agent-card.matched:hover {
      border-color: #c4b5fd;
    }

    .agent-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .agent-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.1px;
    }

    .agent-status {
      font-size: 11.5px;
      font-weight: 550;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .agent-status.available {
      background: var(--green-bg);
      color: #047857;
    }

    .agent-status.offline {
      background: var(--red-bg);
      color: #991b1b;
    }

    .agent-status.unknown {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
    }

    .agent-meta {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .match-reason {
      font-size: 12.5px;
      color: var(--purple);
      font-style: italic;
      margin-bottom: 10px;
      padding: 6px 10px;
      background: rgba(124, 58, 237, 0.05);
      border-radius: 4px;
    }

    .agent-caps {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
    }

    .agent-caps:last-child { margin-bottom: 0; }

    .cap-tag {
      font-size: 11.5px;
      font-weight: 500;
      padding: 2px 9px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 999px;
    }

    .agent-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    /* Task runner */
    .task-runner {
      margin-top: 12px;
      padding: 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
    }

    .task-runner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .task-runner-header span {
      font-size: 12.5px;
      font-weight: 550;
      color: var(--text-secondary);
    }

    .task-runner textarea {
      margin-bottom: 10px;
      background: var(--bg);
    }

    .task-result {
      margin-top: 10px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-tertiary);
    }

    .empty-state svg {
      width: 40px;
      height: 40px;
      stroke: var(--border);
      fill: none;
      stroke-width: 1.5;
      margin-bottom: 14px;
    }

    .empty-state p {
      font-size: 13.5px;
      font-weight: 450;
    }

    .count-badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 1px 8px;
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      border-radius: 999px;
    }

    @media (max-width: 820px) {
      .container {
        grid-template-columns: 1fr;
        padding: 20px;
        gap: 20px;
      }
      .header-inner { flex-wrap: wrap; height: auto; padding: 12px 0; gap: 8px; }
      .header-right { width: 100%; }
      .api-key-input { flex: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-left">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m-10-10h4m12 0h4m-3.5-6.5-2.8 2.8m-5.4 5.4-2.8 2.8m0-11.2 2.8 2.8m5.4 5.4 2.8 2.8"/></svg>
        </div>
        <h1>AgentBoard</h1>
        <span class="tagline">The universal registry for AI agents</span>
      </div>
      <div class="header-right">
        <input type="password" class="api-key-input" id="api-key" placeholder="Anthropic API key (sk-ant-...)" />
        <span class="api-key-saved" id="api-key-saved">Key saved</span>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- Registration form -->
    <div class="panel">
      <div class="panel-header">
        <h2>Register Agent</h2>
      </div>
      <div class="panel-body">
        <form id="register-form">
          <div class="form-group">
            <label for="name">Agent Name</label>
            <input type="text" id="name" placeholder="Summarizer Agent" required>
          </div>
          <div class="form-group">
            <label for="agent-id">Agent ID</label>
            <input type="text" id="agent-id" placeholder="agent-summarizer" required>
          </div>
          <div class="form-group">
            <label for="capabilities">Capabilities</label>
            <input type="text" id="capabilities" placeholder="summarize, translate" required>
          </div>
          <div class="form-group">
            <label for="endpoint">Endpoint URL</label>
            <input type="text" id="endpoint" placeholder="http://127.0.0.1:9001/run" required>
          </div>
          <div class="form-row form-group">
            <div>
              <label for="input-type">Input type</label>
              <input type="text" id="input-type" placeholder="text" required>
            </div>
            <div>
              <label for="output-type">Output type</label>
              <input type="text" id="output-type" placeholder="summary" required>
            </div>
          </div>
          <div class="form-group">
            <label for="owner">Owner</label>
            <input type="text" id="owner" placeholder="caroline" required>
          </div>
          <button type="submit" class="btn" id="submit-btn">Register Agent</button>
          <div class="toast" id="toast"></div>
        </form>
      </div>
    </div>

    <!-- Right column -->
    <div>
      <!-- Search + Agent list panel -->
      <div class="panel">
        <div class="panel-header">
          <h2>Registered Agents</h2>
          <span class="count-badge" id="agent-count">0</span>
        </div>
        <div class="panel-body">
          <!-- Search bar -->
          <div class="search-section">
            <div class="search-bar">
              <input type="text" id="search-input" placeholder="What do you need done? e.g. translate my document..." />
              <button class="btn btn-sm btn-purple" id="search-btn">Search</button>
            </div>
            <div class="search-hint">Uses AI to match your request to agent capabilities</div>
          </div>

          <!-- Search status (hidden by default) -->
          <div id="search-status" style="display:none">
            <div class="search-status">
              <span class="search-label">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <span id="search-status-text">Results</span>
              </span>
              <button class="clear-search" id="clear-search">Show all agents</button>
            </div>
          </div>

          <div id="agent-list" class="agent-list">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h.01M15 9h.01M9 15h6"/></svg>
              <p>No agents registered yet</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API = "http://127.0.0.1:8000";
    const ANTHROPIC_API = "https://api.anthropic.com/v1/messages";
    let allAgents = [];
    let isSearchMode = false;

    // API key management
    const apiKeyInput = document.getElementById("api-key");
    const apiKeySaved = document.getElementById("api-key-saved");

    const stored = sessionStorage.getItem("anthropic_key");
    if (stored) {
      apiKeyInput.value = stored;
      apiKeyInput.style.display = "none";
      apiKeySaved.style.display = "inline";
    }

    apiKeyInput.addEventListener("change", () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        sessionStorage.setItem("anthropic_key", key);
        apiKeyInput.style.display = "none";
        apiKeySaved.style.display = "inline";
      }
    });

    apiKeySaved.addEventListener("click", () => {
      apiKeySaved.style.display = "none";
      apiKeyInput.style.display = "block";
      apiKeyInput.focus();
    });

    function getApiKey() {
      return sessionStorage.getItem("anthropic_key") || apiKeyInput.value.trim();
    }

    // Escaping
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // Toast
    function showToast(msg, type) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `toast ${type}`;
      setTimeout(() => { toast.className = "toast"; }, 4000);
    }

    // Render agents
    function renderAgents(agents, matchData) {
      const list = document.getElementById("agent-list");
      const count = document.getElementById("agent-count");
      count.textContent = allAgents.length;

      if (agents.length === 0) {
        const msg = isSearchMode ? "No matching agents found" : "No agents registered yet";
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h.01M15 9h.01M9 15h6"/></svg>
            <p>${msg}</p>
          </div>`;
        return;
      }

      list.innerHTML = agents.map((a, i) => {
        const matched = matchData && matchData[a.id];
        const reason = matched ? matched.reason : null;
        return `
          <div class="agent-card ${reason ? 'matched' : ''}" data-idx="${i}">
            <div class="agent-card-top">
              <span class="agent-name">${esc(a.name)}</span>
              <span class="agent-status ${a.status === 'available' ? 'available' : a.status === 'offline' ? 'offline' : 'unknown'}">${esc(a.status)}</span>
            </div>
            ${reason ? `<div class="match-reason">${esc(reason)}</div>` : ''}
            <div class="agent-meta">${esc(a.endpoint)} &middot; ${esc(a.owner)}</div>
            <div class="agent-caps">
              ${a.capabilities.map(c => `<span class="cap-tag">${esc(c)}</span>`).join("")}
            </div>
            <div class="agent-actions">
              <button class="btn btn-sm btn-secondary" onclick="toggleRunner(this, '${esc(a.endpoint)}')">Use this agent</button>
            </div>
            <div class="task-runner-slot"></div>
          </div>`;
      }).join("");
    }

    // Load agents
    async function loadAgents() {
      try {
        const res = await fetch(`${API}/agents`);
        allAgents = await res.json();
        if (!isSearchMode) renderAgents(allAgents, null);
      } catch (e) {
        console.error("Failed to load agents:", e);
      }
    }

    // Task runner toggle
    function toggleRunner(btn, endpoint) {
      const card = btn.closest(".agent-card");
      const slot = card.querySelector(".task-runner-slot");

      if (slot.innerHTML) {
        slot.innerHTML = "";
        btn.textContent = "Use this agent";
        return;
      }

      btn.textContent = "Hide";
      const runnerId = "runner-" + Math.random().toString(36).slice(2, 8);
      slot.innerHTML = `
        <div class="task-runner">
          <div class="task-runner-header">
            <span>Send a task</span>
          </div>
          <textarea id="${runnerId}-input" placeholder="Type your task here..." rows="2"></textarea>
          <button class="btn btn-sm" onclick="runTask('${runnerId}', '${esc(endpoint)}')">Run</button>
          <div id="${runnerId}-result"></div>
        </div>`;
    }

    // Run task against agent
    async function runTask(runnerId, endpoint) {
      const input = document.getElementById(`${runnerId}-input`);
      const resultDiv = document.getElementById(`${runnerId}-result`);
      const task = input.value.trim();
      if (!task) return;

      resultDiv.innerHTML = `<div class="task-result"><span class="spinner"></span> Running...</div>`;

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const display = typeof data === "string" ? data : JSON.stringify(data, null, 2);
        resultDiv.innerHTML = `<div class="task-result">${esc(display)}</div>`;
      } catch (err) {
        resultDiv.innerHTML = `<div class="task-result" style="color:var(--red)">Error: ${esc(err.message)}</div>`;
      }
    }

    // AI search
    async function aiSearch(query) {
      const key = getApiKey();
      if (!key) {
        alert("Please enter your Anthropic API key in the header first.");
        return;
      }

      const searchBtn = document.getElementById("search-btn");
      searchBtn.disabled = true;
      searchBtn.innerHTML = `<span class="spinner"></span>`;

      try {
        await loadAgents();

        if (allAgents.length === 0) {
          isSearchMode = false;
          renderAgents([], null);
          return;
        }

        const agentSummaries = allAgents.map(a => ({
          id: a.id,
          name: a.name,
          capabilities: a.capabilities,
        }));

        const res = await fetch(ANTHROPIC_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": key,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1024,
            messages: [{
              role: "user",
              content: `You are an agent matcher. Given a user's request and a list of available agents, determine which agents can handle the request.

Available agents:
${JSON.stringify(agentSummaries, null, 2)}

User request: "${query}"

Return a JSON array of matching agents, ranked by relevance (best match first). Each entry should have:
- "id": the agent id
- "reason": a short sentence explaining why this agent is a good match

If no agents match, return an empty array.

IMPORTANT: Return ONLY valid JSON, no markdown fences, no extra text.`
            }]
          }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || `API ${res.status}`);
        }

        const data = await res.json();
        const text = data.content[0].text.trim();
        const matches = JSON.parse(text);

        isSearchMode = true;
        document.getElementById("search-status").style.display = "block";
        document.getElementById("search-status-text").textContent =
          matches.length ? `${matches.length} match${matches.length > 1 ? 'es' : ''} found` : "No matches";

        const matchMap = {};
        matches.forEach(m => { matchMap[m.id] = m; });

        const ordered = matches
          .map(m => allAgents.find(a => a.id === m.id))
          .filter(Boolean);

        renderAgents(ordered, matchMap);
      } catch (err) {
        alert(`Search failed: ${err.message}`);
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "Search";
      }
    }

    // Clear search
    document.getElementById("clear-search").addEventListener("click", () => {
      isSearchMode = false;
      document.getElementById("search-status").style.display = "none";
      document.getElementById("search-input").value = "";
      renderAgents(allAgents, null);
    });

    // Search events
    document.getElementById("search-btn").addEventListener("click", () => {
      const q = document.getElementById("search-input").value.trim();
      if (q) aiSearch(q);
    });

    document.getElementById("search-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const q = e.target.value.trim();
        if (q) aiSearch(q);
      }
    });

    // Registration form
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Registering\u2026";

      const body = {
        id: document.getElementById("agent-id").value.trim(),
        name: document.getElementById("name").value.trim(),
        capabilities: document.getElementById("capabilities").value.split(",").map(s => s.trim()).filter(Boolean),
        endpoint: document.getElementById("endpoint").value.trim(),
        input: document.getElementById("input-type").value.trim(),
        output: document.getElementById("output-type").value.trim(),
        owner: document.getElementById("owner").value.trim(),
      };

      try {
        const res = await fetch(`${API}/agents/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showToast(`Agent "${body.name}" registered successfully`, "success");
        e.target.reset();
        loadAgents();
      } catch (err) {
        showToast(`Registration failed: ${err.message}`, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Register Agent";
      }
    });

    loadAgents();
    setInterval(loadAgents, 10000);
  </script>

</body>
</html>
